
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Talent Bridge</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #19364A;
      background: #FAF7F0;
    }
    .panel {
      width: 100%;
      max-width: 430px;
      padding: 35px 25px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 40px #19364A18;
    }
    h1 { margin-top: 0; }
    p { line-height: 1.6; color: #647480; }
    input, button {
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      border-radius: 10px;
      font-size: 16px;
    }
    input {
      border: 1px solid #d6dedb;
      outline-color: #80AAA1;
    }
    button {
      border: 0;
      background: #19364A;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    #message { margin-top: 18px; }
    a { color: #19364A; }
  </style>
</head>

<body>
  <main class="panel">
    <h1>Create a new password</h1>
    <p>Choose a new password for your Talent Bridge account.</p>

    <form id="resetForm">
      <input
        id="password"
        type="password"
        placeholder="New password"
        minlength="8"
        required
      >
      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm new password"
        minlength="8"
        required
      >
      <button id="saveButton" type="submit">Save New Password</button>
    </form>

    <p id="message" role="status"></p>
    <p><a href="/admin.html">Return to Admin login</a></p>
  </main>

  <script>
    const SUPABASE_URL = "https://xkvkaoeheifxcxrvnfvg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_D1ZEtTKfWBStZFdo7rqYpQ_CaiDxkI3";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const button = document.getElementById("saveButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.textContent = "Password must be at least 8 characters.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Your passwords do not match.";
        return;
      }

      button.disabled = true;
      button.textContent = "Saving...";

      try {
        const { data: { session }, error: sessionError } =
          await client.auth.getSession();

        if (sessionError) throw sessionError;

        if (!session) {
          throw new Error(
            "Your reset link is invalid or expired. Please request another one."
          );
        }

        const { error } = await client.auth.updateUser({ password });

        if (error) throw error;

        message.textContent =
          "Password updated successfully! You can now return to Admin login.";

        form.reset();
      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = "Save New Password";
      }
    });
  </script>
</body>
</html>
